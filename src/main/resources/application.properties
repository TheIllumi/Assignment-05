spring.application.name=expense-management-system

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense-system-db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:dev_secret_key_change_in_production_environment_with_256_bits_minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration
file.upload.dir=${UPLOAD_DIR:uploads/receipts}
file.upload.max-file-size=10485760
file.upload.max-request-size=52428800

# Spring Boot Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Notification Channel Availability
notification.channel.email.enabled=true
notification.channel.push.enabled=false
notification.channel.sms.enabled=false
notification.channel.inapp.enabled=true